name: Build and Deploy Release

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'helm/idurar-erp-crm/**'
      - '.github/workflows/deploy-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"
          VERSION="${REF_NAME#release/}"
          SHA_SHORT="$(git rev-parse --short=7 HEAD)"

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_LC="$(echo "${REPO_NAME}" | tr '[:upper:]' '[:lower:]')"

          BACKEND_IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-backend"
          FRONTEND_IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}-frontend"
          IMAGE_TAG="${VERSION}-${SHA_SHORT}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Validate release version format
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Branch name must be release/<semver>, got: release/$VERSION"
            exit 1
          fi

  build-backend:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.backend_image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.backend_image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.backend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ needs.prepare.outputs.frontend_image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ needs.prepare.outputs.frontend_image }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.frontend_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build-backend, build-frontend]
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Add Helm repositories
        shell: bash
        run: |
          set -euo pipefail
          helm repo add yandex-bitnami https://mirror.yandex.ru/helm/charts.bitnami.com/
          helm repo update

      - name: Build Helm dependencies
        shell: bash
        run: |
          set -euo pipefail
          helm dependency build ./helm/idurar-erp-crm

      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install iec ./helm/idurar-erp-crm \
            --namespace "${K8S_NAMESPACE}" \
            --create-namespace \
            --set backend.image.repository="${{ needs.prepare.outputs.backend_image }}" \
            --set backend.image.tag="${{ needs.prepare.outputs.image_tag }}" \
            --set frontend.image.repository="${{ needs.prepare.outputs.frontend_image }}" \
            --set frontend.image.tag="${{ needs.prepare.outputs.image_tag }}"
        env:
          K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}