apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "cert-issuer.fullname" . }}
  labels:
    {{- include "cert-issuer.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.email }}
    server: {{ .Values.server }}
    privateKeySecretRef:
      name: {{ include "cert-issuer.fullname" . }}
    {{- with .Values.solvers }}
    solvers:
      {{- toYaml . | nindent 12 }}
    {{- end }}
